<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Do You Love Me?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9ecf,#ffd6e8);
    overflow:hidden;
}

.container{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    max-width:500px;
    width:90%;
}

h1{
    color:#ff1493;
    margin-bottom:25px;
    font-size:2rem;
}

p{
    font-size:1.1rem;
    margin-bottom:25px;
}

button{
    border:none;
    padding:14px 28px;
    font-size:18px;
    border-radius:12px;
    cursor:pointer;
    margin:10px;
    transition:0.3s;
}

#yesBtn{
    background:#28a745;
    color:white;
}

#yesBtn:hover{
    transform:scale(1.1);
}

#noBtn{
    background:#dc3545;
    color:white;
    position:relative;
}

#result{
    display:none;
}

.result-box{
    text-align:left;
    background:#f8f9fa;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}
</style>
</head>
<body>

<div class="container" id="questionBox">
    <h1>💖 Do You Love Me?</h1>
    <p>Please choose an answer 😆</p>

    <button id="yesBtn">❤️ Yes</button>
    <button id="noBtn">😒 No</button>
</div>

<div class="container" id="result">
    <h1>🎉 Result</h1>

    <div class="result-box">
        <h2>🤖 ChatGPT Fact Check</h2>
        <br>

        <p>❌ False Information Detected</p>

        <p>📊 Analyzing your answer...</p>

        <p>██████████ 100%</p>

        <br>

        <h2 style="color:#ff1493;">
            ❤️ The correct answer is:
            "YES"
        </h2>

        <br>

        <p>✅ Verified</p>

        <p>😂 Nice Try...</p>
    </div>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

yesBtn.addEventListener("click", () => {
    showResult();
});

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);

    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

noBtn.addEventListener("click", () => {
    showResult();
});

function showResult(){
    document.getElementById("questionBox").style.display = "none";
    document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
